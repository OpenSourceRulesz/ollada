[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The Rust front-end lives in its own crate directory; maturin builds
# its [[bin]] (named `ollada`) and installs it as the `ollada`
# command. `python -m ollada.cli` still works as the Python fallback
# (and delegates to the binary when it is present).
manifest-path = "ollada-rs/Cargo.toml"
module-name = "ollada"

[project]
name = "ollada"
version = "0.3.7"
description = "The shelf for open-source diffusion language models — pull, run, and serve dLLMs locally, Ollama-style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenSourceRulesz" }]
keywords = ["diffusion", "llm", "dllm", "llada", "local-ai", "inference"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["pyyaml>=6.0", "huggingface-hub"]

[project.optional-dependencies]
# cpu: everything needed to run the CPU-verified models (SDAR on a laptop).
# gpu: the same, plus bitsandbytes (quantized CUDA loads) and einops
# (SDAR-4B's upstream modeling imports it under trust_remote_code).
cpu = ["torch", "transformers", "accelerate", "huggingface-hub"]
gpu = ["torch", "transformers", "accelerate", "bitsandbytes", "huggingface-hub", "einops"]
server = ["fastapi", "uvicorn"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenSourceRulesz/ollada"
Documentation = "https://opensourcerulesz.github.io/ollada"
Repository = "https://github.com/OpenSourceRulesz/ollada"

# No [project.scripts]: maturin refuses a wheel that defines both
# console scripts and a binary, so the Rust binary (named `ollada`)
# IS the `ollada` command. The Python implementation is still the
# fallback for source checkouts via `python -m ollada.cli`.
