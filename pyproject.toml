[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollada"
version = "0.1.0"
description = "The shelf for open-source diffusion language models — pull, run, and serve dLLMs locally, Ollama-style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenSourceRulesz" }]
keywords = ["diffusion", "llm", "dllm", "llada", "local-ai", "inference"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# cpu: everything needed to run the CPU-verified models (SDAR on a laptop).
# gpu: the same, plus bitsandbytes (quantized CUDA loads) and einops
# (SDAR-4B's upstream modeling imports it under trust_remote_code).
cpu = ["torch", "transformers", "accelerate", "huggingface-hub"]
gpu = ["torch", "transformers", "accelerate", "bitsandbytes", "huggingface-hub", "einops"]
server = ["fastapi", "uvicorn"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenSourceRulesz/ollada"
Repository = "https://github.com/OpenSourceRulesz/ollada"

[project.scripts]
ollada = "ollada.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ollada"]
