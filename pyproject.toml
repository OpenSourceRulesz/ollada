[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ollada"
version = "0.0.1"
description = "The shelf for open-source diffusion language models — pull, run, and serve dLLMs locally, Ollama-style."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenSourceRulesz" }]
keywords = ["diffusion", "llm", "dllm", "llada", "local-ai", "inference"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
gpu = ["torch", "transformers", "accelerate", "bitsandbytes", "huggingface-hub"]
server = ["fastapi", "uvicorn"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/OpenSourceRulesz/ollada"
Repository = "https://github.com/OpenSourceRulesz/ollada"

[project.scripts]
ollada = "ollada.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ollada"]
