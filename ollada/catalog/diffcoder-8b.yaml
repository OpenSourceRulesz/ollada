# ollada Recipe (schema v1) — diffcoder:8b
# Defaults below are PROVISIONAL until the verification block is filled by a
# real-load run (see PLAN.md §7). Never publish vendor numbers as verified.
name: diffcoder:8b
family: diffcoder
source: ByteDance-Seed/Stable-DiffCoder-8B-Instruct
license: MIT
task: coding
description: Best open diffusion coder (HumanEval 86.6 / MBPP 85.7 on its card) — the shelf's coding slot.
size_gb_bf16: 16.0
quant_default: int8        # ~8-9 GB — safe on 16GB cards alongside an editor
dtype: float16             # T4-safe; vendor example uses bfloat16 on CUDA
env:
  transformers: "==5.3.0"  # the version the model's config.json was saved with (its custom code targets transformers 5.x; the 4.53.3 shelf pin does NOT apply — separate env)
  extras: [torch, accelerate, bitsandbytes]
generate:
  steps: 256               # swept 2026-10-21 (64/128/256 on the fixed prompt set): 64 collapses (repetition degeneration, bug-fix prompt never delivered), 128 matches 256 on code but its explanation prose carries grammar artifacts; 256 is clean. Vendor example uses 512. Must stay divisible by gen_length/block_length (64).
  gen_length: 256
  block_length: 4          # per vendor example; swept in Phase 2
  remasking: low_confidence
  temperature: 0.0
  threshold: null          # vendor example passes None (fixed transfer schedule); generate_block's own default is 0.95
verified:
  hardware: "Tesla T4 (Colab)"
  tokens_per_sec: 4.1      # at the swept default steps=256 (T4, 2026-10-21 sweep). steps=128 measured 6.8 with prose artifacts; steps=64 measured ~10 but quality-collapsed — see notes.
  vram_gb: 15.15           # peak during load + generation — the T4's 15.6GB is this recipe's FLOOR; ~0.5GB headroom only
  load_seconds: 89.5
  date: "2026-10-21"
  notes: "Verified WITH ollada's mask-dtype repair active (their generate_block hardcodes a bf16 mask; fp16-on-T4 needs it aligned — see adapters/diffcoder.py). Steps swept 2026-10-21 (sweep notebook v0.1.0, same prompt set): 64 steps COLLAPSES — repetition degeneration ('by by by...' on the bug-fix prompt, 'maps maps maps' on the hash-map prompt, early-EOS never fires); 128 steps: code fully correct but explanation prose has grammar artifacts ('accumulatinging', 'two couple of issues'); 256 steps (the default): same correct code, prose clean. Quality at the default: bug-fix excellent (both planted bugs diagnosed, corrected code right); palindrome code correct/clean but ignores the 'only output code' instruction (preamble + explanation added); hash-map exact. Known limit at ALL step counts: the model's verbose style (preamble + long docstring) exhausts the 256-token canvas mid-answer on the Fibonacci prompt — a gen_length question, not a steps question; a gen_length bump is future sweep material."
# Second verification, desktop GPU — the pre-launch re-check the T4 numbers
# were waiting on. Same loader-safe shape as cpu_verified: the runtime
# recipe loader ignores unknown keys, so this is site-builder data only.
desktop_verified:
  hardware: "Desktop — NVIDIA GeForce RTX 5060 Ti (15.9 GB), Windows 11"
  vram_gb: 13.65           # peak over 13 observations, ollada's own measurement loop (up from 9.17 over 5 — peak is a maximum, so the latest max stands)
  date: "2026-10-25"
  notes: "Same fixed prompt set at recipe defaults. Train-speed reasoning correct (90 km/h, clean working; first answer 240.2s including first-run warmup, identical repeat 26.0s); one-word capital probe exactly 'Paris' (0.7s); Fibonacci iterative and correct (12.3s). Fits with ~1.2 GB to spare (needs ~14.7 GB with headroom on the 15.9 GB card) — tighter than the 5-observation stamp suggested; the T4 15.15 GB peak does not transfer exactly, but this is still a tight fit on a display-driving card, not a comfortable one. Evening variant prompts add prompt-sensitivity evidence: a 60 km / 45 min train problem came out WRONG (40 km/h via 45/60 = 3/2 hours — it is 3/4; dream and sdar got 80 on the same prompt); a fib-with-docstring request came out correct but cut off mid-code (the known 256-canvas limit); and 'one word' without 'exactly' produced a verbose Paris-plus-explanation instead of the bare word. The fixed set stays steady; variants wobble."
