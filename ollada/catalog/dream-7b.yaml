name: dream:7b
family: dream
source: Dream-org/Dream-v0-Instruct-7B
license: Apache-2.0
task: chat
description: Dream 7B instruct — strong general diffusion chat model; ollada's proven-harness flagship.
size_gb_bf16: 15.2
