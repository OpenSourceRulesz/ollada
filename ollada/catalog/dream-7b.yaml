# ollada Recipe (schema v1) — dream:7b
# Defaults below are PROVISIONAL until the verification block is filled by a
# real-load run (see PLAN.md §7). Never publish vendor numbers as verified.
name: dream:7b
family: dream
source: Dream-org/Dream-v0-Instruct-7B
license: Apache-2.0
task: chat
description: Dream 7B instruct — strong general diffusion chat model; ollada's proven-harness flagship.
size_gb_bf16: 15.2
quant_default: int8        # ~8 GB — the T4 / 16GB-card default
dtype: float16             # T4-safe; bf16 cards may override
env:
  transformers: "==4.53.3" # Dream's custom code breaks on transformers 5.x (RoPE 'default' KeyError)
  extras: [torch, accelerate, bitsandbytes]
generate:
  steps: 32
  gen_length: 256
  block_length: 32
  temperature: 0.2
  remasking: low_confidence
verified:
  hardware: "Tesla T4 (Colab)"
  tokens_per_sec: 28.0     # steady-state canvas tok/s (runs: 19.4 first/warmup, 28.3, 28.0, 27.9)
  vram_gb: 9.80            # peak during load + generation — so ~10GB is the practical floor at these defaults; 8GB cards will not fit dream:7b as-is
  load_seconds: 249.1      # includes the first-time ~15GB weight download in Colab; cached loads are a separate (unmeasured) number
  date: "2026-10-21"
  notes: "Quality at steps=32: short factual + math answers good (train-speed problem correct with steps); code output can garble mid-block and long list answers can truncate early — see PLAN.md Phase 2 steps sweep. Coding slot belongs to diffcoder:8b."
