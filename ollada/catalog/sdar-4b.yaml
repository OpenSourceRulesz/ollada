# ollada Recipe (schema v1) — sdar:4b
# Defaults below are PROVISIONAL until the verification block is filled by a
# real-load run (see PLAN.md §7). Never publish vendor numbers as verified.
name: sdar:4b
family: sdar
source: JetLM/SDAR-4B-Chat
license: Apache-2.0
task: chat
description: SDAR 4B — Qwen3-4B converted to block diffusion; strongest per-size diffusion generalist in its paper (MMLU 74.9 / GSM8K 89.9, diffusion mode).
size_gb_bf16: 8.8
quant_default: bf16        # fits 16GB cards whole; int8 optional for 8GB cards
dtype: float16             # T4-safe (weights are bf16; fp16 load per the reference script's default)
env:
  transformers: ">=4.57,<5" # 4.x only, same as 1.7b: 5.x is unverified for this family and breaks the 1.7B modeling (SDARConfig.pad_token_id — Dell worker run, 2026-10-25). Verified on 4.57.6 (T4 + RTX 5060 Ti). Its modeling imports TransformersKwargs (added in 4.57); the README's >=4.52.4 is stale. NOT the Dream env — see the adapter docstring for the three load-time repairs (flash_attn fallback, missing HF file, BlockMask-only attention)
  extras: [torch, accelerate, einops] # einops: the 4B modeling does `from einops import rearrange`; a clean env without it cannot load the model (found on the laptop CPU runs, 2026-10-23; Colab had it ambiently)
generate:
  gen_length: 256
  block_length: 4          # reference config: block 4, 4 denoising steps
  denoising_steps: 4
  remasking: low_confidence_dynamic
  confidence_threshold: 0.9
  temperature: 1.0
  top_p: 1.0
  top_k: 0
verified:
  hardware: "Tesla T4 (Colab, High-RAM runtime)"
  tokens_per_sec: 12.3     # median of full-length runs (range 9.5-18.9 canvas tok/s); the one-word instruction probe finished in 1.2s via early stop and is excluded
  vram_gb: 8.87            # peak during load + generation
  min_host_ram_gb: 16      # observed floor, NOT a measured minimum: the load ran out of host RAM on Colab's standard (~13GB) runtime and succeeded on High-RAM; 16 is the prudent floor the fit check enforces
  load_seconds: 45.1
  date: "2026-10-21"
  notes: "Verified WITH ollada's load repairs active (torch RMSNorm fallback for flash_attn, authors' fused file restored from GitHub, BlockMask loop, eager flex attention, inner-model drive — see adapters/sdar.py). Quality at recipe defaults: math correct with clean steps; Fibonacci correct and runnable (better than dream:7b's garbled attempt); 3-item list complete (dream truncated its own); one-word instruction probe answered exactly 'Paris'. Speed is eager-flex-bound on T4 (scores matrix materialized); compiled flex is a Phase 2 revisit. Colab note: the standard-RAM T4 runtime was not enough during load — High-RAM runtime worked; GPU VRAM itself peaked at only 8.87GB."
# Third verification, desktop GPU — the pre-launch re-check the T4 numbers
# were waiting on. Same loader-safe shape as cpu_verified: the runtime
# recipe loader ignores unknown keys, so this is site-builder data only.
desktop_verified:
  hardware: "Desktop — NVIDIA GeForce RTX 5060 Ti (15.9 GB), Windows 11"
  vram_gb: 8.34            # peak over 15 observations, ollada's own measurement loop (unchanged from the 5-observation stamp — peak is stable)
  date: "2026-10-25"
  notes: "Same fixed prompt set at recipe defaults. Fibonacci recursive and correct (3.8s). Fits with ~6.6 GB to spare (needs ~9.3 GB with headroom) — in line with the 8.87 GB T4 peak. Evening variant prompts on the same card all correct: 60 km / 45 min train → 80 km/h (27.0s), fib with docstring correct twice (30.3s, 44.2s), one-word capital exactly 'Paris' (13.0s after the worker build)."
# Second verification, CPU only — drives the card's CPU badge and the model
# page's CPU addendum (both used to be hardcoded/undocumented). The runtime
# recipe loader ignores unknown keys, so this is site-builder data only.
cpu_verified:
  hardware: "Laptop — Intel Core Ultra 7 365 (8 cores), 32GB RAM, Windows 11; CPU only, bf16"
  peak_host_ram_gb: 8.6
  date: "2026-10-23"
  notes: "Fixed prompt set at recipe defaults, all correct — train-speed reasoning 63.5s, one-word capital probe exactly 'Paris' 2.4s, Fibonacci code 16.2s. The 2-step reduced config garbled Fibonacci: 4 steps is the floor. See FINDINGS §7."
