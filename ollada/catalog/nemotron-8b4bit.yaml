# ollada Recipe (schema v1) — nemotron:8b4bit
# Same family as nemotron:3b (the shelf's 3B), loaded in 4-bit (BitsAndBytes
# NF4, weight-only) instead of bf16. The bf16 8B would need ~17 GB peak and
# does not fit a 16 GB card; the 4-bit variant should peak around 5-6 GB.
# The 3B entry stays untouched.
# Name note: the recipe name regex allows only [a-z0-9.] after the colon,
# so this is "8b4bit", not "8b-int4".
name: nemotron:8b4bit
family: nemotron
source: nvidia/Nemotron-Labs-Diffusion-8B
license: NVIDIA Nemotron Open Model License  # confirmed from the repo's own model card (license_name: nvidia-nemotron-open-model-license)
task: chat
description: Nemotron-Labs Diffusion 8B in 4-bit (NF4 weight-only) — same tri-mode family as nemotron:3b, bigger (34 layers vs 26), fits a 16 GB card with headroom.
size_gb_bf16: 16.0      # estimate only: 8B params x 2 bytes bf16; no weights-size measurement yet (HF API did not return file sizes)
quant_default: int4     # BitsAndBytesConfig(load_in_4bit=True); the nemotron adapter already supports int4
dtype: bfloat16         # same as nemotron:3b
env:
  transformers: "==5.20.2"  # same pin as nemotron:3b — NVIDIA's vendored modeling_ministral.py needs check_model_inputs, which 5.3.0 removed
  extras: [torch, accelerate, bitsandbytes]
generate:
  mode: diffusion          # same as nemotron:3b; ollada runs diffusion mode only
  max_new_tokens: 256      # same as nemotron:3b
  block_length: 32         # same as nemotron:3b (adapter default; also the config's block_size)
  threshold: 0.9           # same as nemotron:3b (adapter default)
# Verified under PLAN.md §7 through ollada's own code on 2026-11-16:
# `ollada run` via the nemotron worker on a Colab A100, fixed set 3/3
# (train 90 km/h in 32.8s, capital Paris in 21.4s, fib correct in 22.1s),
# peak VRAM 6.18 GB over 6 observations. Desktop 5060 Ti verification
# through ollada is still pending — this is an A100 verification, not a
# desktop one, and the hardware label says so.
# Config checked 2026-11-15 against the live repo: same architecture as the
# shelf 3B (NemotronLabsDiffusionModel, model_type nemotron_labs_diffusion,
# same custom modeling files, block_size 32, mask_token_id 100), only bigger
# (34 layers vs 26, hidden 4096 vs 3072, intermediate 14336 vs 9216).
# There is no separate Nemotron-Labs-Diffusion-8B-Instruct repo — the model
# lives at nvidia/Nemotron-Labs-Diffusion-8B, which ships a chat template.
verified:
  hardware: "NVIDIA A100-SXM4-80GB (Colab)"
  date: "2026-11-16"
  vram_gb: 6.18
  notes: "Verified through ollada run (nemotron worker, transformers 5.20.2, NF4 weight-only), fixed set 3/3: train 90 km/h (32.8s), capital Paris (21.4s), fib correct (22.1s). Peak VRAM 6.18 GB over 6 observations. Desktop 5060 Ti verification still pending."
