# ollada Recipe (schema v1) — nemotron:3b
# Defaults below are PROVISIONAL until the verification block is filled by a
# real-load run (see PLAN.md §7). Never publish vendor numbers as verified.
name: nemotron:3b
family: nemotron
source: nvidia/Nemotron-Labs-Diffusion-3B
license: NVIDIA Nemotron Open Model License
task: chat
description: NVIDIA's tri-mode 3B — one checkpoint does AR, block-diffusion, and self-speculation. The small/fast shelf slot.
size_gb_bf16: 6.2
quant_default: bf16        # 3B fits whole on any gaming card; int8 optional
dtype: bfloat16            # use float16 on T4 (no native bf16 acceleration)
env:
  transformers: ">=5.0.0"  # conflicts with dream's pin — isolated worker env (PLAN.md §3)
  extras: [torch, accelerate]
generate:
  mode: diffusion          # diffusion | ar | linear_spec
  max_new_tokens: 512
  block_length: 32
  threshold: 0.9
verified:
  hardware: null
  tokens_per_sec: null
  vram_gb: null
  date: null
